name: Archive repository traffic

# GitHub exposes /traffic/views for roughly 14 days only. This workflow copies
# the completed UTC days into `traffic-history.json` on the dedicated
# `traffic-history` branch (an orphan branch holding that one file and no
# workflow source) so the series is not lost.
#
# Scope: date, count, uniques. No referrers, paths, URLs, users or credentials.
# It never touches the default branch and never force-pushes. It pushes its own
# `traffic-history` branch, which is independent, so it does not deploy Pages.
#
# Manual runs: `workflow_dispatch` only works once this file is on the default
# branch, and the job-level `if` below keeps every run on that branch, so
# unreviewed code can never write the archive. A manual run behaves exactly like
# the scheduled one (merge, then push only if the file changed).

on:
  schedule:
    # 每天 UTC 04:43（北京时间 12:43）。特意晚于 UTC 零点数小时，让 GitHub
    # 结算完前一天的计数；脚本仍会跳过尚未结束的 UTC 日。
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 串行化：同一次运行结束前不开始下一次，不取消进行中的归档。
  group: traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive completed UTC days
    # 定时与手动触发都只在默认分支上运行，避免用未审代码写归档分支。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 只需推送 traffic-history 分支；不给 issues、pages、id-token 等权限。
      contents: write
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4
        with:
          # 保留 checkout 写入 .git/config 的凭据，脚本用 origin 读取并快进推送
          # traffic-history，token 不出现在命令行或日志里。
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge completed days into traffic-history
        # TRAFFIC_TOKEN 优先；未配置时回退到工作流 GITHUB_TOKEN。
        # 两者都没有该仓库的 Traffic 读取权限时任务失败，不写入任何 0。
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/archive-traffic.mjs --publish
